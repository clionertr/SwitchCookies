<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SwitchCookies</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 顶部：当前网站 -->
  <header class="site-bar">
    <img id="site-favicon" class="site-favicon" alt="" hidden>
    <div class="site-text">
      <div id="site-domain" class="site-domain" data-i18n="loading"></div>
      <div id="site-sub" class="site-sub"></div>
    </div>
    <button id="btn-open-tab" class="icon-btn" data-i18n-title="open_in_tab" aria-label="open in tab">⤢</button>
  </header>

  <!-- 标签栏 -->
  <nav class="tabs" role="tablist">
    <button class="tab active" role="tab" data-tab="profiles" data-i18n="tab_profiles"></button>
    <button class="tab" role="tab" data-tab="cookies" data-i18n="tab_cookies"></button>
    <button class="tab" role="tab" data-tab="more" data-i18n="tab_more"></button>
  </nav>

  <main id="main">
    <!-- ===== 账号页 ===== -->
    <section id="view-profiles" class="view active">
      <button id="btn-save" class="btn btn-primary btn-big">
        <span class="btn-icon">＋</span>
        <span class="btn-text">
          <strong data-i18n="save_current"></strong>
          <small data-i18n="save_current_hint"></small>
        </span>
      </button>

      <form id="save-form" class="card save-form" hidden autocomplete="off">
        <label class="field">
          <span data-i18n="profile_name"></span>
          <input id="save-name" type="text" data-i18n-placeholder="profile_name_placeholder" maxlength="60">
        </label>
        <div id="save-name-warn" class="hint warn" hidden></div>
        <label class="check">
          <input id="save-subdomains" type="checkbox">
          <span data-i18n="include_subdomains"></span>
        </label>
        <div class="hint" data-i18n="include_subdomains_hint"></div>
        <details class="advanced">
          <summary data-i18n="capture_hint"></summary>
          <label class="check"><input id="save-ls" type="checkbox"><span data-i18n="capture_ls"></span><span id="save-ls-count" class="badge"></span></label>
          <label class="check"><input id="save-ss" type="checkbox"><span data-i18n="capture_ss"></span><span id="save-ss-count" class="badge"></span></label>
          <label class="check"><input id="save-idb" type="checkbox"><span data-i18n="capture_idb"></span><span id="save-idb-count" class="badge"></span></label>
        </details>
        <div class="form-actions">
          <button type="submit" id="save-submit" class="btn btn-primary" data-i18n="save"></button>
          <button type="button" id="save-cancel" class="btn btn-ghost" data-i18n="cancel"></button>
        </div>
      </form>

      <div class="search-row">
        <input id="profile-search" type="search" data-i18n-placeholder="search">
      </div>

      <div id="profiles-empty" class="empty" hidden>
        <div class="empty-icon">🍪</div>
        <div class="empty-title" data-i18n="empty_title"></div>
        <ol class="empty-steps">
          <li data-i18n="empty_step1"></li>
          <li data-i18n="empty_step2"></li>
          <li data-i18n="empty_step3"></li>
        </ol>
        <div class="hint" style="margin-top:10px" data-i18n="empty_tip_menu"></div>
      </div>

      <div id="profiles-site" class="group" hidden>
        <h3 class="group-title" data-i18n="site_profiles"></h3>
        <div class="list"></div>
      </div>

      <details id="profiles-other" class="group" hidden>
        <summary class="group-title"><span data-i18n="other_profiles"></span> <span class="count"></span></summary>
        <div class="list"></div>
      </details>

      <div id="profiles-nomatch" class="hint center" data-i18n="no_match" hidden></div>
    </section>

    <!-- ===== Cookie 页 ===== -->
    <section id="view-cookies" class="view">
      <div class="seg" role="radiogroup">
        <button class="seg-btn active" data-scope="site" data-i18n="scope_site"></button>
        <button class="seg-btn" data-scope="all" data-i18n="scope_all"></button>
      </div>

      <div class="search-row">
        <input id="cookie-search" type="search" data-i18n-placeholder="search">
        <span id="cookie-count" class="count"></span>
      </div>

      <div id="cookies-toolbar-site" class="toolbar">
        <button id="btn-add-cookie" class="btn btn-sm">＋ <span data-i18n="add_cookie"></span></button>
        <button id="btn-clear-site" class="btn btn-sm btn-danger-ghost" data-i18n="clear_site"></button>
      </div>
      <div id="cookies-toolbar-all" class="toolbar" hidden>
        <button id="btn-add-cookie-all" class="btn btn-sm">＋ <span data-i18n="add_cookie"></span></button>
        <button id="btn-toggle-groups" class="btn btn-sm" data-i18n="expand_all"></button>
        <button id="btn-export-all-cookies" class="btn btn-sm btn-danger-ghost" data-i18n="export_all_cookies"></button>
      </div>
      <div id="all-warning" class="hint warn" data-i18n="all_cookies_warning" hidden></div>

      <div id="cookies-list" class="list"></div>
    </section>

    <!-- ===== 更多页 ===== -->
    <section id="view-more" class="view">
      <section class="card">
        <h3 data-i18n="sec_data"></h3>
        <div class="btn-row">
          <button id="btn-import" class="btn" data-i18n="import_file"></button>
          <button id="btn-export-profiles" class="btn" data-i18n="export_profiles"></button>
          <button id="btn-export-site" class="btn" data-i18n="export_site_cookies"></button>
        </div>
        <div class="hint" data-i18n="import_hint"></div>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </section>

      <section class="card">
        <h3 data-i18n="sec_webdav"></h3>
        <div class="hint" data-i18n="webdav_hint"></div>
        <label class="field"><span data-i18n="webdav_url"></span><input id="webdav-url" type="url" placeholder="https://dav.example.com/dav/"></label>
        <div class="two-col">
          <label class="field"><span data-i18n="webdav_user"></span><input id="webdav-user" type="text" autocomplete="off"></label>
          <label class="field"><span data-i18n="webdav_pass"></span><input id="webdav-pass" type="password" autocomplete="off"></label>
        </div>
        <div class="btn-row">
          <button id="webdav-save" class="btn" data-i18n="webdav_save"></button>
          <button id="webdav-upload" class="btn btn-primary" data-i18n="webdav_upload"></button>
          <button id="webdav-download" class="btn" data-i18n="webdav_download"></button>
        </div>
      </section>

      <section class="card">
        <h3 data-i18n="sec_ip"></h3>
        <div class="hint" data-i18n="ip_hint"></div>
        <div class="btn-row"><button id="btn-ip" class="btn" data-i18n="ip_check"></button></div>
        <div id="ip-result" class="kv" hidden></div>
      </section>

      <section class="card">
        <h3 data-i18n="sec_appearance"></h3>
        <div class="row">
          <span data-i18n="theme"></span>
          <div class="seg seg-sm" id="theme-seg">
            <button class="seg-btn" data-theme="system" data-i18n="theme_system"></button>
            <button class="seg-btn" data-theme="light" data-i18n="theme_light"></button>
            <button class="seg-btn" data-theme="dark" data-i18n="theme_dark"></button>
          </div>
        </div>
        <div class="row">
          <span data-i18n="language"></span>
          <select id="lang-select">
            <option value="auto" data-i18n="lang_auto"></option>
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
          </select>
        </div>
      </section>

      <section class="card">
        <h3 data-i18n="sec_advanced"></h3>
        <div class="hint" data-i18n="default_capture"></div>
        <div class="check-row">
          <label class="check"><input id="set-ls" type="checkbox"><span data-i18n="capture_ls"></span></label>
          <label class="check"><input id="set-ss" type="checkbox"><span data-i18n="capture_ss"></span></label>
          <label class="check"><input id="set-idb" type="checkbox"><span data-i18n="capture_idb"></span></label>
        </div>
        <div class="btn-row"><button id="btn-reset-confirms" class="btn btn-sm" data-i18n="reset_confirms"></button></div>
        <div id="storage-usage" class="hint"></div>
        <div id="version" class="hint"></div>
      </section>
    </section>
  </main>

  <!-- Cookie 编辑抽屉 -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <form id="cookie-form" class="sheet-panel" autocomplete="off">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button type="button" id="sheet-close" class="icon-btn" aria-label="close">✕</button>
      </div>
      <label class="field"><span data-i18n="f_name"></span><input id="ck-name" type="text" required></label>
      <label class="field"><span data-i18n="f_value"></span><textarea id="ck-value" rows="3"></textarea></label>
      <div class="two-col">
        <label class="field"><span data-i18n="f_domain"></span><input id="ck-domain" type="text"></label>
        <label class="field"><span data-i18n="f_path"></span><input id="ck-path" type="text" value="/"></label>
      </div>
      <label class="check"><input id="ck-session" type="checkbox"><span data-i18n="f_session"></span></label>
      <label class="field" id="ck-expires-field"><span data-i18n="f_expires"></span><input id="ck-expires" type="datetime-local"></label>
      <div class="two-col">
        <label class="check"><input id="ck-secure" type="checkbox"><span data-i18n="f_secure"></span></label>
        <label class="check"><input id="ck-httponly" type="checkbox"><span data-i18n="f_httponly"></span></label>
      </div>
      <label class="field"><span data-i18n="f_samesite"></span>
        <select id="ck-samesite">
          <option value="unspecified" data-i18n="samesite_unspecified"></option>
          <option value="no_restriction" data-i18n="samesite_no_restriction"></option>
          <option value="lax" data-i18n="samesite_lax"></option>
          <option value="strict" data-i18n="samesite_strict"></option>
        </select>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
        <button type="button" id="sheet-cancel" class="btn btn-ghost" data-i18n="cancel"></button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/popup/main.js"></script>
</body>
</html>
