name: Build and Release Chrome Extension

# 本项目是零构建（原生 ES Module），发布只需打 zip。
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$VER"
          test "$TAG" = "$VER"

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/SwitchCookies-${GITHUB_REF_NAME}.zip" \
            manifest.json background.js popup.html popup.css src icons LICENSE README.md \
            -x '*.DS_Store'

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.zip
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}